;===============================================================================
; platformio.ini - PlatformIO Configuration
;===============================================================================
; Version: 1.0.0
; Date: 2025-11-25
; Author: Stealth Deck Project
; License: MIT
;
; PlatformIO configuration for ESP32 firmware.
;===============================================================================

[platformio]
default_envs = esp32dev

;===============================================================================
; Common Configuration
;===============================================================================
[common]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    bblanchon/ArduinoJson@^6.21.3
    
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time

;===============================================================================
; ESP32 Development Environment
;===============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Board configuration
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Upload settings
upload_speed = 921600
upload_port = /dev/ttyUSB0

; Monitor settings
monitor_port = /dev/ttyUSB0
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

; Build flags
build_flags =
    ${common.build_flags}
    -DESP32_DEV
    
; Library dependencies
lib_deps =
    ${common.lib_deps}

;===============================================================================
; Testing Environment
;===============================================================================
[env:test]
platform = espressif32
board = esp32dev
framework = arduino

; Test configuration
test_framework = unity
test_build_src = yes
test_transport = serial

; Build flags
build_flags =
    ${common.build_flags}
    -DUNIT_TEST
    
; Library dependencies
lib_deps =
    ${common.lib_deps}

monitor_speed = ${common.monitor_speed}

;===============================================================================
; OTA Update Environment
;===============================================================================
[env:esp32_ota]
extends = env:esp32dev

; OTA upload settings
upload_protocol = espota
upload_port = stealth-deck.local
upload_flags =
    --auth=stealth-deck-ota

;===============================================================================
; Production Environment (Optimized)
;===============================================================================
[env:production]
extends = env:esp32dev

; Optimization flags
build_flags =
    ${common.build_flags}
    -DPRODUCTION
    -Os
    -DCORE_DEBUG_LEVEL=0
    
build_unflags =
    -DCORE_DEBUG_LEVEL=3

;===============================================================================
; Debug Environment
;===============================================================================
[env:debug]
extends = env:esp32dev

; Debug flags
build_type = debug
build_flags =
    ${common.build_flags}
    -DDEBUG
    -DCORE_DEBUG_LEVEL=5
    -ggdb
    -O0

debug_tool = esp-prog
debug_init_break = tbreak setup

;===============================================================================
; Memory Analysis Environment
;===============================================================================
[env:memory]
extends = env:esp32dev

; Memory analysis flags
build_flags =
    ${common.build_flags}
    -DMEMORY_ANALYSIS
    -Wl,--print-memory-usage
    
check_tool = cppcheck, clangtidy
check_flags =
    cppcheck: --enable=all
    clangtidy: --checks=*
