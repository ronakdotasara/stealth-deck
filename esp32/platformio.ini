;===============================================================================
; platformio.ini - Stealth Deck LILYGO T-Display-S3 RM67162
;===============================================================================
; Version: 1.0.7 | LILYGO OFFICIAL LIBRARY (FIXES BLACK SCREEN)
; Date: 2025-12-01 | SKU: 1729838 | ESP32-S3R8 + 6MB Flash + 8MB PSRAM
;===============================================================================

[platformio]
default_envs = lilygo-t-display-s3

;===============================================================================
; COMMON CONFIGURATION
;===============================================================================
[common]
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    mathertel/OneButton@^2.0.3
    ; ✅ REMOVED: bodmer/TFT_eSPI (CAUSES BLACK SCREEN)
    
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time

;===============================================================================
; LILYGO T-Display-S3 RM67162 (OFFICIAL LIBRARY)
;===============================================================================
[env:lilygo-t-display-s3]
platform = espressif32@6.7.0
board = lilygo-t-display-s3
framework = arduino

; Hardware: ESP32-S3R8 + 6MB Flash + 8MB PSRAM
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.psram_type = opi

; Mac USB Serial (Auto-detect)
upload_speed = 921600
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*

; ✅ LILYGO OFFICIAL LIBRARY - RM67162 SUPPORT
lib_deps = 
    ${common.lib_deps}
    https://github.com/Xinyuan-LilyGO/LilyGo-T-Display-S3.git#main

; Debug flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

;===============================================================================
; PRODUCTION BUILD (Flash Optimized)
;===============================================================================
[env:production]
extends = env:lilygo-t-display-s3
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DPRODUCTION
    -Os
    -DNDEBUG
build_unflags = -DCORE_DEBUG_LEVEL=3

;===============================================================================
; DEBUG BUILD
;===============================================================================
[env:debug]
extends = env:lilygo-t-display-s3
build_type = debug
build_flags = 
    ${env:lilygo-t-display-s3.build_flags}
    -DDEBUG
    -DCORE_DEBUG_LEVEL=5
    -ggdb
    -O0
