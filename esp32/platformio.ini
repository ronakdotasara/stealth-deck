; ============================================================================
; platformio.ini - PlatformIO Configuration for Stealth Deck ESP32
; ============================================================================
; Version: 1.0.0
; Date: 2025-11-24
; Description: Build configuration for ESP32 firmware
; ============================================================================

[platformio]
default_envs = esp32dev

; ============================================================================
; Common Configuration
; ============================================================================
[common]
lib_deps = 
    lvgl/lvgl@^8.3.11
    bblanchon/ArduinoJson@^6.21.3
    bodmer/TFT_eSPI@^2.5.34
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE

; ============================================================================
; ESP32 Development Board Configuration
; ============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = 
    default
    esp32_exception_decoder

; Upload Configuration
upload_speed = 921600
upload_port = /dev/cu.usbserial-*

; Build Configuration
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; Partitions
board_build.partitions = default.csv

; Build Flags
build_flags = 
    ${common.build_flags}
    -DESP32
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=536
    -Os
    -std=gnu++17

; Library Dependencies
lib_deps = 
    ${common.lib_deps}

; Extra Scripts
extra_scripts = 
    pre:scripts/pre_build.py

; ============================================================================
; ESP32 Production Configuration
; ============================================================================
[env:esp32-production]
extends = env:esp32dev
build_type = release
build_flags = 
    ${env:esp32dev.build_flags}
    -DNDEBUG
    -DCORE_DEBUG_LEVEL=0
    -O2

monitor_speed = 115200

; ============================================================================
; ESP32 Debug Configuration
; ============================================================================
[env:esp32-debug]
extends = env:esp32dev
build_type = debug
build_flags = 
    ${env:esp32dev.build_flags}
    -DDEBUG
    -DCORE_DEBUG_LEVEL=5
    -Og
    -g

debug_tool = esp-prog
debug_init_break = tbreak setup

; ============================================================================
; OTA Configuration
; ============================================================================
[env:esp32-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.100
upload_flags = 
    --port=3232
    --auth=stealth-deck-ota

; ============================================================================
