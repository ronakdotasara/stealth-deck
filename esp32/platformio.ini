; Date: 2025-11-30
; Author: Stealth Deck Project
; License: MIT
;
; PlatformIO configuration for LILYGO T-Display-S3 AMOLED
;===============================================================================

[platformio]
default_envs = lilygo-t-display-s3

;===============================================================================
; Common Configuration
;===============================================================================
[common]
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I.
    
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    https://github.com/Xinyuan-LilyGO/T-Display-S3-AMOLED.git
    lvgl/lvgl@^8.3.11
    
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time

;===============================================================================
; LILYGO T-Display-S3 AMOLED Environment
;===============================================================================
[env:lilygo-t-display-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board configuration
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

; Upload settings
upload_speed = 921600
upload_port = /dev/cu.usbmodem101   ; Updated port for macOS

; Monitor settings
monitor_port = /dev/cu.usbmodem101  ; Updated port for macOS
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

; Build flags
build_flags =
    ${common.build_flags}
    -DLILYGO_T_DISPLAY_S3_AMOLED
    -DARDUINO_ESP32S3_DEV

; Library dependencies
lib_deps =
    ${common.lib_deps}

;===============================================================================
; Production Environment (Optimized)
;===============================================================================
[env:production]
extends = env:lilygo-t-display-s3

; Optimization flags
build_flags =
    ${common.build_flags}
    -DPRODUCTION
    -Os
    -DCORE_DEBUG_LEVEL=0
    
build_unflags =
    -DCORE_DEBUG_LEVEL=3

;===============================================================================
; Debug Environment
;===============================================================================
[env:debug]
extends = env:lilygo-t-display-s3

; Debug flags
build_type = debug
build_flags =
    ${common.build_flags}
    -DDEBUG
    -DCORE_DEBUG_LEVEL=5
    -ggdb
    -O0
